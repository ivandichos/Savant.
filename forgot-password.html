<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | Savant</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="forgot">
<div class="auth">

  <aside class="auth-art">
    <img src="assets/login-perfume.png" alt="Savant perfume bottle">
    <h1>SAVANT</h1>
    <p>Discover your signature scent</p>
  </aside>

  <main class="auth-form">
    <div class="box">
      <a class="back" href="index.html">&#8249; Back to shop</a>
      <a class="brand" href="index.html"><img src="assets/logo.png" alt="Savant"></a>

      <h2>Forgot password?</h2>
      <p class="sub" id="forgot-sub">Enter your account email and choose a new password.</p>
      <p id="form-msg" class="msg" role="status"></p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
          <span class="err" role="alert"></span>
        </div>
        <button class="btn" type="submit">Continue</button>
      </form>

      <form id="reset-form" novalidate hidden>
        <p class="sub">Set a new password for <strong id="reset-for"></strong>.</p>
        <div class="field">
          <label for="password">New password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="new-password">
            <button class="toggle" type="button" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="err" role="alert"></span>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <div class="input-wrap">
            <input id="confirm" type="password" autocomplete="new-password">
            <button class="toggle" type="button" data-target="confirm" aria-label="Show password">Show</button>
          </div>
          <span class="err" role="alert"></span>
        </div>
        <button class="btn" type="submit">Save new password</button>
      </form>

      <p class="switch"><a href="login.html">&#8249; Back to log in</a></p>
      <p class="note">Class-project demo: there's no email server, so you reset the password right here.</p>
    </div>
  </main>

</div>
<script src="js/auth.js"></script>
</body>
</html>
