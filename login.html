<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Savant</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">
<div class="auth">

  <aside class="auth-art">
    <img src="assets/bleu-bottle.png" alt="Savant perfume bottle">
    <h1>SAVANT</h1>
    <p>Discover your signature scent</p>
  </aside>

  <main class="auth-form">
    <div class="box">
      <a class="back" href="index.html">&#8249; Back to shop</a>
      <a class="brand" href="index.html"><img src="assets/logo.png" alt="Savant"></a>

      <h2>Welcome back</h2>
      <p class="sub">Log in to your Savant account.</p>
      <p id="form-msg" class="msg" role="status"></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
          <span class="err" role="alert"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="current-password">
            <button class="toggle" type="button" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="err" role="alert"></span>
        </div>

        <div class="options">
          <label class="check"><input id="remember" type="checkbox"> Remember my email</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button class="btn" type="submit">Log in</button>
      </form>

      <p class="switch">New to Savant? <a href="signup.html" id="to-signup">Create an account</a></p>
      <p class="note">Demo accounts for a class project, saved in this browser only. Don't use a real password.</p>
    </div>
  </main>

</div>
<script src="js/auth.js"></script>
</body>
</html>
